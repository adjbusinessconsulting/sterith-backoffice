<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sterith Back Office — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Exactly the families/weights the real Back Office loads via next/font
     (app/layout.tsx): EB Garamond 400-700 normal+italic, Hanken Grotesk 400-700. -->
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Sterith Back Office — self-contained interactive demo.
   Mirrors the real app (Backoffice/): same palette, type scale,
   sidebar sections, top bar and page layouts. Sample data only.
   =========================================================== */
:root{
  --garamond:"EB Garamond",Georgia,serif;
  --hanken:"Hanken Grotesk",system-ui,sans-serif;
  --ink:#0D1117; --canvas:#FAFAF7; --side:#f6f3ea; --line:#e8e3d5;
  --mute:#8f897a; --faint:#a49d8c; --gold:#b8934a; --gold-lt:#e7c987;
  --gold-bg:#f1e7cd; --eyebrow:#96762f; --panel:#f8f6ef; --navy:#2a5f78; --green:#3f7d54;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--hanken);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column;height:100vh}
button,input,select{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
::selection{background:var(--gold-lt);color:var(--ink)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d9d3c4;border-radius:99px}
.num{font-family:var(--garamond);font-variant-numeric:oldstyle-nums tabular-nums}
.g{font-family:var(--garamond)}

/* ---------- demo bar ---------- */
.demobar{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#f4ecd4;border-bottom:1px solid rgba(184,147,74,.35)}
.demobar .kick{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;white-space:nowrap}
.demobar .msg{font-size:11.5px;color:#7a6f57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demobar .exit{margin-left:auto;flex-shrink:0;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold);border:1px solid rgba(184,147,74,.45);border-radius:99px;padding:5px 11px;background:transparent;text-decoration:none}
.demobar .exit:hover{background:rgba(184,147,74,.12)}

/* ---------- shell ---------- */
.shell{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:248px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;gap:9px}
.brand-name{font-family:var(--garamond);font-weight:700;font-size:17px;letter-spacing:.05em;line-height:1.1}
.brand-sub{font-size:8px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-top:1.5px;font-weight:600}
.store-sel{margin:10px 8px 6px;padding:9px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.store-av{width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--garamond);font-size:12px;font-weight:700;color:#fff}
.store-nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-meta{font-size:10.5px;color:var(--mute);margin-top:.5px}
.nav{flex:1;overflow-y:auto;padding-bottom:8px}
.sec-head{display:flex;align-items:center;gap:6px;width:100%;padding:10px 14px 4px;text-align:left;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600;transition:color .12s}
.sec-head:hover,.sec-head.open{color:var(--ink)}
.sec-head .chev{transition:transform .15s ease}
.sec-head.open .chev{transform:rotate(180deg)}
.sec-dot{width:5px;height:5px;border-radius:99px;background:var(--gold)}
.sec-body{display:none}
.sec-body.open{display:block}
.navlink{display:block;padding:2px 8px;width:100%;text-align:left}
.navrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;transition:background .12s}
.navlink:hover .navrow{background:rgba(13,17,23,.045)}
.navlink.active .navrow{background:var(--ink)}
.navlink.active .navrow:hover{background:var(--ink)}
.navrow svg{flex-shrink:0;color:var(--mute)}
.navlink.active .navrow svg{color:#f8f6ef}
.navrow span.lb{font-size:13px;flex:1}
.navlink.active .navrow span.lb{color:#f8f6ef;font-weight:600}
.badge{font-size:7px;letter-spacing:.1em;font-weight:700;background:rgba(184,147,74,.15);color:var(--gold);border:1px solid rgba(184,147,74,.3);padding:1px 5px;border-radius:3px;text-transform:uppercase;white-space:nowrap}
.side-foot{border-top:1px solid var(--line);padding:8px 12px;flex-shrink:0}
.feedback{width:100%;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--mute)}
.feedback span{font-size:12px;font-weight:600;color:var(--ink)}
.user-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.user-av{width:32px;height:32px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--garamond);font-size:13px;font-weight:700;color:#f8f6ef}
.user-nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:10.5px;color:var(--mute)}
.tier-pill{font-size:9px;letter-spacing:.08em;font-weight:700;background:var(--gold-bg);color:var(--gold);padding:2px 7px;border-radius:99px;text-transform:uppercase}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
.hamburger{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);flex-shrink:0}
.search{flex:1;max-width:440px;min-width:0;height:36px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px;cursor:text}
.search span.ph{flex:1;min-width:0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-size:10.5px;color:var(--mute);background:var(--line);padding:2px 6px;border-radius:5px;flex-shrink:0}
.sync{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.sync span{font-size:12.5px;color:var(--mute);white-space:nowrap}
.tier-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(184,147,74,.4);background:rgba(184,147,74,.1);flex-shrink:0}
.tier-btn span{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.bell{position:relative;padding:6px;border-radius:8px;flex-shrink:0}
.bell b{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--gold);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.page{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:32px 36px;max-width:1100px}

/* ---------- page atoms ---------- */
.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--eyebrow);font-weight:600;margin-bottom:8px}
h1.t{font-family:var(--garamond);font-size:34px;font-weight:500;line-height:1.15;margin-bottom:6px}
.sub{font-size:13px;color:var(--mute)}
.seg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;display:flex;gap:2px;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border-radius:8px;color:var(--mute);font-size:12.5px}
.seg button.on{background:var(--ink);color:#f8f6ef;font-weight:600}
.kpis{display:flex;gap:12px;flex-wrap:wrap}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;flex:1;min-width:150px}
.kpi .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;margin-bottom:8px}
.kpi .v{font-family:var(--garamond);font-size:32px;font-weight:500;line-height:1;font-variant-numeric:oldstyle-nums}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:6px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.panel-head h2{font-family:var(--garamond);font-size:17px;font-weight:600}
.panel-head .hint{font-size:11px;color:var(--faint)}
.stack{display:flex;flex-direction:column;gap:16px}
.cols-chart{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cols-4{display:grid;grid-template-columns:repeat(4,1fr)}
.pill{height:34px;padding:0 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:13px}
.pill.on{background:var(--ink);border-color:var(--ink);color:#f8f6ef;font-weight:600}

/* chart */
.chart{position:relative}
.bars{display:flex;align-items:flex-end}
.bars button{flex:1;min-width:2px;border-radius:3px 3px 1px 1px;transition:opacity .12s ease}
.bars.dim button:not(.on){opacity:.45}
.tip{position:absolute;z-index:5;background:var(--ink);color:#f8f6ef;border-radius:10px;padding:9px 12px;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(13,17,23,.18)}
.tip .l{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#c9a55f;font-weight:600}
.tip .v{font-family:var(--garamond);font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:oldstyle-nums}
.tip .m{font-family:var(--garamond);font-size:12.5px;color:#a8a294;margin-top:2px;font-variant-numeric:oldstyle-nums}
.axis{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--faint)}
.trk{height:8px;background:#f1ede1;border-radius:99px;overflow:hidden}
.trk>i{display:block;height:100%;border-radius:99px}

/* table */
.tbl-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl-scroll{overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap}
td{padding:13px 16px;font-size:13px;border-bottom:1px solid #f2eee2;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fcfaf4}
.r{text-align:right}.c{text-align:center}
.tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:rgba(63,125,84,.12);color:var(--green)}
.tag.warn{background:var(--gold-bg);color:var(--gold)}
.tag.bad{background:rgba(193,90,73,.12);color:#c15a49}
.tag.neutral{background:#f1ede1;color:var(--mute)}

/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.pcard{background:var(--gold-bg);border:1.5px solid #e8d9b8;border-radius:14px;padding:0;text-align:left;overflow:hidden;position:relative;transition:transform .15s ease,box-shadow .2s ease}
.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(13,17,23,.10)}
.pcard .qty{padding:14px 14px 0;display:flex;justify-content:flex-end;font-family:var(--garamond);font-size:12px;color:var(--eyebrow);font-weight:600;font-variant-numeric:oldstyle-nums}
.pcard .ini{padding:8px 14px 10px;display:flex;align-items:center;justify-content:center;height:100px;font-family:var(--garamond);font-size:52px;font-weight:500;color:#d4c099;line-height:1;user-select:none}
.pcard .foot{background:#fff;border-top:1px solid #e8d9b8;padding:10px 12px}
.pcard .nm{font-size:12.5px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .cat{font-size:11px;color:var(--mute);margin-bottom:4px}
.pcard .prc{font-family:var(--garamond);font-size:16px;font-weight:500;font-variant-numeric:oldstyle-nums}

/* banners */
.info{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:flex-start;gap:10px}
.info p{font-size:12.5px;line-height:1.6}
.demo-banner{display:flex;align-items:flex-start;gap:12px;background:#f4ecd4;border:1px solid rgba(184,147,74,.35);border-radius:14px;padding:13px 16px}
.demo-banner .ic{width:34px;height:34px;border-radius:9px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.demo-banner .kick{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.demo-banner .ttl{font-size:13.5px;font-weight:700}
.demo-banner p{font-size:12.5px;color:#7a6f57;line-height:1.6;margin-top:2px}
.dark-card{background:var(--ink);border-radius:14px;padding:20px 24px;color:#f8f6ef}
.dark-card .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a8a294;font-weight:600;margin-bottom:8px}
.dark-card .v{font-family:var(--garamond);font-size:32px;font-weight:500;font-variant-numeric:oldstyle-nums}
.soon{display:flex;align-items:center;justify-content:center;min-height:60vh}
.soon-ic{width:64px;height:64px;border-radius:16px;background:var(--gold-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}

.backdrop{display:none;position:fixed;inset:32px 0 0;background:rgba(13,17,23,.45);z-index:55}
.backdrop.open{display:block}

/* ---------- responsive (mirrors the real Back Office) ---------- */
@media (max-width:860px){
  .sidebar{position:fixed;top:32px;bottom:0;left:0;transform:translateX(-100%);transition:transform .25s ease;z-index:60;box-shadow:2px 0 28px rgba(13,17,23,.22)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex}
  .cols-4{grid-template-columns:1fr 1fr}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl-scroll>table{min-width:560px}
}
@media (max-width:640px){
  .demobar .msg{font-size:10.5px}
  .pad{padding:22px 16px}
  .topbar{padding:0 14px;gap:10px}
  .kbd,.sync span{display:none}
  .cols-chart,.cols-4{grid-template-columns:1fr}
  h1.t{font-size:27px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .pcard .ini{height:72px;font-size:38px}
  .kpi{min-width:132px;padding:13px 14px}
  .kpi .v{font-size:26px}
}
</style>
</head>
<body>

<div class="demobar">
  <span class="kick">Mode Demo</span>
  <span class="msg">Data contoh — apa pun yang Anda ubah di sini tidak tersimpan dan tidak menyentuh toko mana pun.</span>
  <a class="exit" id="demoExit" href="#" style="display:none">← Keluar demo</a>
</div>

<div class="backdrop" id="backdrop"></div>

<div class="shell">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 100 100" style="flex-shrink:0">
        <rect x="10" y="62" width="14" height="26" rx="3" fill="#b8934a"/>
        <rect x="30" y="50" width="14" height="38" rx="3" fill="#c9a55f"/>
        <rect x="50" y="34" width="14" height="54" rx="3" fill="#d4b36c"/>
        <rect x="70" y="22" width="14" height="66" rx="3" fill="#e7c987"/>
        <polygon points="63,22 91,22 77,4" fill="#e7c987"/>
      </svg>
      <div>
        <div class="brand-name">STERITH</div>
        <div class="brand-sub">BACKOFFICE</div>
      </div>
    </div>

    <div class="store-sel">
      <div class="store-av">BJ</div>
      <div style="flex:1;min-width:0">
        <div class="store-nm">Toko Berkah Jaya</div>
        <div class="store-meta">Jl. Merdeka 12 · 1 outlet</div>
      </div>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8f897a" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>

    <div class="nav" id="nav"></div>

    <div class="side-foot">
      <button class="feedback">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <span>Kritik &amp; Saran</span>
      </button>
    </div>

    <div class="user-foot">
      <div class="user-av">AD</div>
      <div style="flex:1;min-width:0">
        <div class="user-nm">Anthony D.</div>
        <div class="user-role">Owner · akses penuh</div>
      </div>
      <span class="tier-pill">Premium</span>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Buka menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8f897a" stroke-width="1.8" style="flex-shrink:0"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="ph">Cari produk, SKU, atau supplier...</span>
        <span class="kbd">⌘K</span>
      </div>
      <div style="flex:1"></div>
      <div class="sync"><i></i><span id="syncTime">Tersinkron</span></div>
      <button class="tier-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#b8934a" stroke-width="2"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        <span>Premium</span>
      </button>
      <button class="bell">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <b>6</b>
      </button>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   Icons (lucide paths, matching the real sidebar)
   ============================================================ */
var I = {
  dash:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  line:'<path d="M3 3v18h18"/><path d="M19 9l-5 5-4-4-3 3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/>',
  pie:'<path d="M21 12A9 9 0 1112 3v9z"/>',
  boxes:'<rect x="3" y="8" width="8" height="8" rx="1"/><rect x="13" y="8" width="8" height="8" rx="1"/><path d="M8 8V5h8v3"/>',
  trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/>',
  pkg:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/>',
  store:'<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
  swap:'<path d="M7 4L3 8l4 4"/><path d="M3 8h13"/><path d="M17 20l4-4-4-4"/><path d="M21 16H8"/>',
  clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 13l2 2 4-4"/>',
  hist:'<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/>',

/* Bar chart — same interaction as the real one: hover/tap a bar to read it. */
var chartSeq = 0;
function barChart(bars,height,gap,footer){
  var id='chart'+(++chartSeq);
  var max=Math.max.apply(null,bars.map(function(b){return b.value;}).concat([1]));
  var h=height||150, g=(gap===undefined?3:gap);
  var html='<div class="chart" id="'+id+'"><div class="bars" style="height:'+h+'px;gap:'+g+'px">';
  bars.forEach(function(b,i){
    var bg = b.emphasis ? '#0D1117' : (b.value>0 ? 'linear-gradient(180deg,#e7c987,#b8934a)' : '#ece8dc');
    var pct = Math.max((b.value/max)*100, b.value>0?3:0.5);
    html+='<button data-i="'+i+'" style="height:'+pct+'%;background:'+bg+'"></button>';
  });
  html+='</div>'+(footer||'')+'</div>';
  pending.push(function(){
    var root=document.getElementById(id); if(!root) return;
    var wrap=root.querySelector('.bars');
    var tip=null;
    function clear(){ if(tip){tip.remove();tip=null;} wrap.classList.remove('dim');
      wrap.querySelectorAll('button.on').forEach(function(b){b.classList.remove('on');}); }
    function show(i,btn){
      clear(); var b=bars[i];
      wrap.classList.add('dim'); btn.classList.add('on');
      tip=document.createElement('div'); tip.className='tip';
      tip.innerHTML='<div class="l">'+esc(b.label)+'</div><div class="v">'+esc(b.valueText)+'</div>'+
        (b.meta?'<div class="m">'+esc(b.meta)+'</div>':'');
      tip.style.bottom=(h+10)+'px';
      var centre=((i+0.5)/bars.length)*100;
      if(centre<14){ tip.style.left='0'; }
      else if(centre>86){ tip.style.right='0'; }
      else { tip.style.left=centre+'%'; tip.style.transform='translateX(-50%)'; }
      root.appendChild(tip);
    }
    wrap.querySelectorAll('button').forEach(function(btn){
      var i=+btn.dataset.i;
      btn.addEventListener('pointerenter',function(){ show(i,btn); });
      btn.addEventListener('pointerdown',function(){ show(i,btn); });
    });
    root.addEventListener('pointerleave',clear);
  });
  return html;
}

    }).join('')
  );
  return h+'</div>';
};

/* ---- Add-on pages: the real preview/upsell state ---- */
function addonPage(title,sub,addon,bullets){
  var b=bullets.map(function(x){
    return '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f2eee2">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b8934a" stroke-width="2" style="flex-shrink:0;margin-top:2px"><path d="M20 6L9 17l-5-5"/></svg>'+
      '<span style="font-size:13px;line-height:1.55">'+x+'</span></div>';
  }).join('');
  return '<div class="pad">'+
    '<div class="demo-banner" style="margin-bottom:20px">'+
      '<div class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8934a" stroke-width="1.9"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>'+
      '<div style="flex:1"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px">'+
        '<span class="kick">Mode Demo · Add-on Berbayar</span><span class="ttl">'+esc(addon)+'</span></div>'+
        '<p>Ini pratinjau dengan data contoh (<b>Toko Berkah Jaya</b>). Coba jelajahi — untuk memakainya dengan katalog toko Anda, aktifkan add-on ini lewat tombol <b>Paket</b> di atas.</p>'+
      '</div></div>'+
    header('ADD-ON · '+addon.toUpperCase(),title,sub)+
    panel('Yang Anda dapat','',b)+
    '<div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">'+
      '<button style="height:40px;padding:0 18px;background:var(--ink);border-radius:10px;font-size:13px;font-weight:600;color:#f8f6ef">Aktifkan add-on</button>'+
      '<button style="height:40px;padding:0 18px;background:#fff;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600">Lihat paket</button>'+
    '</div></div>';
}
var ADDON_PAGES={
  'inv-ringkasan':['Ringkasan inventori','Nilai stok, perputaran, dan barang lambat jual di seluruh lokasi.','Inventori Lengkap'],
  'inv-gudang':['Gudang','Stok yang belum masuk rak toko — terpisah dari stok jual.','Inventori Lengkap'],
  'inv-toko':['Toko','Stok yang siap dijual, otomatis berkurang dari transaksi POS.','Inventori Lengkap'],
  'inv-transfer':['Transfer stok','Pindahkan barang dari gudang ke toko dengan jejak yang tercatat.','Inventori Lengkap'],
  'inv-opname':['Stok opname','Hitung fisik vs sistem, catat selisih, dan kunci hasilnya.','Inventori Lengkap'],
  'inv-riwayat':['Riwayat stok','Setiap pergerakan barang: masuk, keluar, transfer, dan penyesuaian.','Inventori Lengkap'],
  'crm-pelanggan':['Pelanggan','Basis data pelanggan dengan riwayat belanja dari POS.','CRM & Loyalti'],
  'crm-loyalti':['Loyalti','Poin, tier, dan hadiah yang bisa ditukar langsung di kasir.','CRM & Loyalti'],
  'sc-katalog':['Katalog Showcase','Etalase online yang mengambil produk dan harga dari POS.','Showcase'],
  'sc-drops':['Drops','Rilis produk terbatas dengan hitung mundur dan notifikasi.','Showcase'],
  'sc-reservasi':['Reservasi','Pelanggan memesan slot atau barang sebelum datang.','Showcase'],
  'sc-pengaturan':['Pengaturan Showcase','Domain, tema, jam buka, dan cara pemesanan.','Showcase']
};
var ADDON_BULLETS={
  'Inventori Lengkap':['Stok gudang dan stok toko dipisah, dengan transfer yang tercatat','Stok opname: hitung fisik vs sistem, selisih terkunci','Riwayat pergerakan barang per produk','Nilai persediaan dan barang lambat jual'],
  'CRM & Loyalti':['Pelanggan otomatis terkumpul dari transaksi POS','Poin dan tier yang bisa ditukar di kasir','Riwayat belanja per pelanggan','Segmen pelanggan untuk promo'],
  'Showcase':['Etalase online yang selalu ikut harga dan stok POS','Drops terjadwal dengan hitung mundur','Reservasi dan pre-order','Domain dan tema sendiri']
};
Object.keys(ADDON_PAGES).forEach(function(k){
  PAGES[k]=function(){
    var a=ADDON_PAGES[k];
    return addonPage(a[0],a[1],a[2],ADDON_BULLETS[a[2]]);
  };
});

/* ============================================================
   Router / render
   ============================================================ */
var current=(location.hash||'').replace('#','')||'an-penjualan';
if(!PAGES[current]) current='an-penjualan';
var openSections={};

function renderNav(){
  var h='';
  NAV.forEach(function(sec,si){
    var holds=sec.items.some(function(it){ return it.id===current; });
    if(openSections[si]===undefined) openSections[si]=holds;
    if(holds) openSections[si]=true;
    var open=!sec.label || openSections[si];
    if(sec.label){
      h+='<button class="sec-head'+(open?' open':'')+'" data-sec="'+si+'">'+
        '<span style="flex:1">'+sec.label+'</span>'+
        (!open&&holds?'<span class="sec-dot"></span>':'')+
        '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>';
    }
    h+='<div class="sec-body'+(open?' open':'')+'">';
    sec.items.forEach(function(it){
      h+='<button class="navlink'+(it.id===current?' active':'')+'" data-go="'+it.id+'">'+
        '<div class="navrow">'+ico(it.icon)+'<span class="lb">'+esc(it.label)+'</span>'+
        (it.addon?'<span class="badge">Add-on</span>':'')+'</div></button>';
    });
    h+='</div>';
  });
  var nav=document.getElementById('nav');
  nav.innerHTML=h;
  nav.querySelectorAll('[data-sec]').forEach(function(b){
    b.addEventListener('click',function(){ var i=+b.dataset.sec; openSections[i]=!openSections[i]; renderNav(); });
  });
  nav.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){
      current=b.dataset.go;
      closeDrawer();
      render();
      document.getElementById('page').scrollTop=0;
    });
  });
}

function render(){
  var fn=PAGES[current]||PAGES['dashboard'];
  document.getElementById('page').innerHTML=fn();
  flush();
  renderNav();
}

/* drawer (mobile) */
var sidebar=document.getElementById('sidebar'), backdrop=document.getElementById('backdrop');
function closeDrawer(){ sidebar.classList.remove('open'); backdrop.classList.remove('open'); }
document.getElementById('hamburger').addEventListener('click',function(){
  sidebar.classList.toggle('open'); backdrop.classList.toggle('open');
});
backdrop.addEventListener('click',closeDrawer);

/* "Keluar demo" only when whoever opened the demo told us where back is
   (the Back Office login passes ?exit=/login; the website embed passes nothing) */
var exitTo=(location.search.match(/[?&]exit=([^&]+)/)||[])[1];
if(exitTo){
  var ex=document.getElementById('demoExit');
  ex.href=decodeURIComponent(exitTo);
  ex.style.display='inline-block';
}

/* clock in the top bar */
function tick(){
  var n=new Date();
  document.getElementById('syncTime').textContent='Tersinkron · '+pad(n.getHours())+'.'+pad(n.getMinutes());
}
tick(); setInterval(tick,30000);

render();
})();
</script>
